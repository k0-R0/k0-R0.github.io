name: Sync Profile README

on:
  push:
    branches:
      - main
    paths:
      - 'GITHUB_PROFILE_README.md'
  workflow_dispatch:

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Portfolio Repo
        uses: actions/checkout@v4
        with:
          path: portfolio

      - name: Checkout Profile Repo (k0-R0/k0-R0)
        uses: actions/checkout@v4
        with:
          repository: 'k0-R0/k0-R0'
          token: ${{ secrets.PROFILE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          path: profile

      - name: Copy and Commit README
        run: |
          cp portfolio/GITHUB_PROFILE_README.md profile/README.md
          cd profile
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s) ]]; then
            git add README.md
            git commit -m "docs: sync profile README from portfolio repository"
            git push
          else
            echo "Profile README is already up to date."
          fi
